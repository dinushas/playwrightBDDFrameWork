
name: Cucumber Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 19 * * *'  # 8 PM UK time (7 PM UTC)

jobs:
  test:
    name: "Cucumber E2E - ${{ matrix.browser }}"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create .env file
        run: echo "BASE_URL=${{ secrets.BASE_URL }}" >> .env

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # STEP 1: Run Cucumber tests per browser
      - name: Run Header Feature Tests (${{ matrix.browser }})
        run: BROWSER=${{ matrix.browser }} npx cucumber-js tests/features/header-navigation.feature --require tests/steps --format json:reports/cucumber-report-${{ matrix.browser }}.json

      # STEP 2: Generate HTML Report
      - name: Generate HTML Report
        run: node reports/generate-report.js

      # STEP 3: Upload report per browser
      - name: Upload Cucumber HTML Report (${{ matrix.browser }})
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report-${{ matrix.browser }}
          path: reports/html